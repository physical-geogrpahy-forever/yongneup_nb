name: Sweep shallow PFT8 competition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-pft8-shallow-competition-sweep.yml'
      - 'pb4_chelsa21k/tools/sweep_pft8_shallow_competition.py'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate
      - name: Run sweep
        run: python pb4_chelsa21k/tools/sweep_pft8_shallow_competition.py
      - name: Commit results
        run: |
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/results/pft8_shallow_competition_sweep_20261006
          git commit -m 'Run PFT8 shallow competition sweep [skip ci]' || exit 0
          git push origin HEAD:main
