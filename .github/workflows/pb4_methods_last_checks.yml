name: PB4 methods last checks
on:
  push:
    paths:
      - '.github/workflows/pb4_methods_last_checks.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining Methods details
        shell: bash
        run: |
          set -euo pipefail
          ZIP=pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip
          rm -rf /tmp/pb4last && mkdir -p /tmp/pb4last
          unzip -q "$ZIP" -d /tmp/pb4last
          ROOT="$(find /tmp/pb4last -maxdepth 1 -type d -name 'PB4Studio*' | head -n1)"
          echo "=== SCIENCE CONFIG EXACT ==="
          sed -n '350,445p' "$ROOT/pb4studio/config.py"
          echo "=== RUNNER GRID EXACT ==="
          sed -n '289,390p' "$ROOT/pb4studio/runner.py"
          echo "=== TEXTURE LOADER ==="
          grep -n "def load_soil_texture" -A120 "$ROOT/pb4studio/grid.py" || true
          echo "=== BARE BEDROCK ==="
          grep -RniE 'bare_bedrock_tolerance_m|bare_bedrock' "$ROOT/pb4studio" | head -n 200
          echo "=== PELLETIER 2010 REFERENCES ==="
          grep -RniE 'Pelletier \(2010\)|Pelletier, 2010|2010.*Pelletier|grid-resolution-independent' "$ROOT" | head -n 200 || true
