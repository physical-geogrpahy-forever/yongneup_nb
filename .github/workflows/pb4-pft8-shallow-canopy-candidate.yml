name: Test PFT8 shallow-canopy competition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-pft8-shallow-canopy-candidate.yml'
      - 'pb4_chelsa21k/tools/test_pft8_shallow_canopy_candidate.py'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran zip
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate
      - name: Run candidate
        run: python pb4_chelsa21k/tools/test_pft8_shallow_canopy_candidate.py
      - name: Commit candidate and diagnostics
        run: |
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/results/pft8_shallow_canopy_candidate_20261006
          git add pb4_chelsa21k/model_candidates/PB4Studio_v6.6.3_CHELSA21K_PFT8_SHALLOW_CANOPY.zip
          git commit -m 'Test PFT8 shallow-canopy competition candidate [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
