name: Package Pelletier AGB Eq5 candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-chelsa21k-package-pelletier-agb-eq5.yml'
      - 'pb4_chelsa21k/tools/package_pelletier_agb_eq5_candidate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install light runtime
        run: python -m pip install numpy pandas
      - name: Build exact candidate ZIP
        run: python pb4_chelsa21k/tools/package_pelletier_agb_eq5_candidate.py
      - name: Commit candidate ZIP
        run: |
          set -euo pipefail
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/model_candidates/PB4Studio_v6.6.3_CHELSA21K_PELLETIER_AGB_EQ5.zip
          git commit -m 'Archive exact Pelletier Eq5 candidate package [skip ci]' || exit 0
          git push origin HEAD:main
