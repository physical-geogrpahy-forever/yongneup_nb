name: Yakutia site soil-depth raster audit
on:
  push:
    branches:
      - yakutia-dwd-eemt-fix-20261113
    paths:
      - .github/workflows/yakutia-soil-point-audit.yml
      - pb4_chelsa21k/education/tests/audit_yakutia_soil_point.py
  workflow_dispatch:

jobs:
  soil:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster access
        run: python -m pip install -q numpy requests rasterio
      - name: Audit soil thickness at embedded Yakutsk cell
        run: |
          set -o pipefail
          python pb4_chelsa21k/education/tests/audit_yakutia_soil_point.py 2>&1 | tee yakutia_soil_point.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yakutia-soil-depth-point
          path: |
            yakutia_soil_point_audit.json
            yakutia_soil_point.log
          if-no-files-found: warn
          retention-days: 10
