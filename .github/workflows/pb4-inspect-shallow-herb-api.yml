name: Inspect PB4 shallow herb API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-inspect-shallow-herb-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect final package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4inspect
          mkdir -p /tmp/pb4inspect
          python - <<'PY'
          import zipfile, pathlib
          z=pathlib.Path('pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip')
          with zipfile.ZipFile(z) as zz:
              zz.extractall('/tmp/pb4inspect')
              for n in zz.namelist():
                  low=n.lower()
                  if any(k in low for k in ('biome4_backend','climate.py','run_yongneup','depth','sweep','diagnostic','config.py')):
                      print(n)
          PY
          root=$(find /tmp/pb4inspect -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          echo "ROOT=$root"
          echo '=== embedded inputs all ==='
          find "$root/embedded_inputs" -maxdepth 4 -type f | sed "s#^$root/##" | sort || true
          echo '=== finite-depth root and WHC implementation ==='
          grep -nE 'root|McKenzie|mckenzie|depth_m|soil_depth|whc|water holding|r30|finite' "$root/pb4studio/climate.py" | head -n 500 || true
          echo '=== climate helper top ==='
          sed -n '1,90p' "$root/pb4studio/climate.py" || true
          echo '=== embedded Beyer climate sample ==='
          python - <<'PY'
          import csv, pathlib, glob
          root=pathlib.Path(glob.glob('/tmp/pb4inspect/PB4Studio*')[0])
          for rel in ['embedded_inputs/yongneup/yongneup_climate_128.25E_38.25N.csv','embedded_inputs/yongneup_exact20m/climate_yongneup_128.25E_38.25N.csv']:
              p=root/rel
              with p.open(encoding='utf-8-sig',newline='') as f:
                  rows=list(csv.DictReader(f))
              print(rel)
              print('shape',len(rows),len(rows[0]) if rows else 0)
              print('columns',list(rows[0]) if rows else [])
              kas=[float(x['ka_bp']) for x in rows]
              print('ka coverage',min(kas),max(kas),'unique',len(set(kas)))
              for x in rows[:15]: print(x)
              print('TAIL')
              for x in rows[-15:]: print(x)
          PY
          echo '=== climate arrays block ==='
          sed -n '469,603p' "$root/pb4studio/climate.py" || true
          echo '=== package Beyer mentions ==='
          grep -RIl 'Beyer' "$root" | sed "s#^$root/##" | head -n 300 || true
          echo '=== PFT activation source ==='
          if [ -n "$src" ]; then grep -n -E 'pfts\([0-9]+\)|pfts\(pft\)' "$src" | head -n 500 || true; fi
          echo '=== PFT12 source context ==='
          grep -RniE 'cold herbaceous|pft.?12|pfts\(12\)|25\.0|Tundra shrub|Lichen/forb' "$root/fortran" "$root/pb4studio" | head -n 400 || true
          echo '=== BIOME4 source PFT parameter block ==='
          src=$(find "$root" -type f -iname 'biome4*.f' | head -1)
          echo "SRC=$src"
          if [ -n "$src" ]; then
            grep -n -A120 -B30 'subroutine pftdata' "$src" | head -n 220 || true
            grep -n -A80 -B20 'cold herbaceous' "$src" | head -n 180 || true
            grep -n -A160 -B20 'findnpp' "$src" | head -n 260 || true
            grep -n -A160 -B20 'competition2' "$src" | head -n 300 || true
          fi
          echo '=== PFT12 competition exact lines ==='
          if [ -n "$src" ]; then
            grep -nE 'optpft.*12|grasspft.*12|pft.*12|present\(12\)|gdd0|gdd5' "$src" | sed -n '1,500p' || true
            sed -n '440,760p' "$src" || true
            sed -n '760,1120p' "$src" || true
          fi
          echo '=== backend key defs ==='
          grep -nE '^(class|def) |pftpar|climate|mckenzie|root|depth|run_biome|evaluate' "$root/pb4studio/biome4_backend.py" | head -n 260 || true
          echo '=== climate key defs ==='
          grep -nE '^(class|def) |CHELSA|Beyer|agb|npp|lai|pft' "$root/pb4studio/climate.py" | head -n 260 || true
          echo '=== selfcontained runner PFT output lines ==='
          grep -nE 'pft[0-9]+_npp|pft_npp|validation_per_output|np.save|write_csv|to_csv|summary_rows|vegetation_class' "$root/tools/run_yongneup_21ka_chelsa_selfcontained.py" | head -n 500 || true
          echo '=== selfcontained runner head ==='
          sed -n '1,320p' "$root/tools/run_yongneup_21ka_chelsa_selfcontained.py" || true
          echo '=== mckenzie depth sensitivity tool ==='
          sed -n '1,420p' "$root/tools/mckenzie2003_depth_sensitivity.py" || true
          echo '=== soil depth sensitivity tool ==='
          sed -n '1,320p' "$root/tools/soil_depth_sensitivity.py" || true
          echo '=== config science ==='
          grep -nE 'class ScienceConfig|biome4_variant|pft|climate' "$root/pb4studio/config.py" | head -n 260 || true
          echo '=== tests/tools names ==='
          find "$root" -maxdepth 3 -type f | sed "s#^$root/##" | grep -Ei 'test|depth|sweep|diagn|onecell|single' | head -n 300 || true
