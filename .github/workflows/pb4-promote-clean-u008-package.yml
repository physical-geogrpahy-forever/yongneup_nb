name: PB4 promote clean U008 package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-promote-clean-u008-package.yml'

permissions:
  contents: write

jobs:
  build-clean-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install verification runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy pandas matplotlib openpyxl rasterio

      - name: Build FULL_EXPORT distribution from current canonical
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4_clean_build
          python pb4_chelsa21k/tools/build_full_export_distribution_v2.py \
            --source-zip pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip \
            --work-dir /tmp/pb4_clean_build \
            --exporter pb4_chelsa21k/tools/export_all_outputs.py
          root=$(find /tmp/pb4_clean_build -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          test -n "$root"
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Clean package and unify plot code
        shell: bash
        run: |
          set -euo pipefail
          python pb4_chelsa21k/tools/clean_package_v3.py \
            --root "$ROOT" \
            --repo-root "$GITHUB_WORKSPACE"

          python -m py_compile \
            "$ROOT/pb4studio/figures.py" \
            "$ROOT/pb4studio/standard_report.py" \
            "$ROOT/tools/export_all_outputs.py" \
            "$ROOT/gui/main.py"

          PYTHONPATH="$ROOT" python - <<'PY'
          from pathlib import Path
          import os, re, sys
          root = Path(os.environ["ROOT"])
          sys.path.insert(0, str(root))
          import pb4studio
          expected = "6.6.3-CHELSA21K-FINAL-nativeClimate-BIOME4AGB-U008"
          assert pb4studio.__version__ == expected, pb4studio.__version__
          text = (root / "gui" / "main.py").read_text(encoding="utf-8")
          assert f'EXPECTED_VERSION = "{expected}"' in text
          print("VERSION_OK", expected)
          PY

          ! grep -R "6.6.3-CHELSA21K-envicloud-nolapse" "$ROOT" \
            --include='*.py' --include='*.txt' --include='*.md' --include='*.bat'

      - name: Verify package figures from existing final result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/outputs_CHELSA21K/model_static" "$ROOT/outputs_CHELSA21K/model_dynamic"

          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          root = Path(os.environ["ROOT"])
          src = pd.read_csv(
              "pb4_chelsa21k/results/final_integrated_20261006/FINAL_AGB_21KA_TIMESERIES.csv",
              encoding="utf-8-sig",
          )
          assert len(src[src["mode"] == "static"]) == 211
          assert len(src[src["mode"] == "dynamic"]) == 211
          for mode in ("static", "dynamic"):
              d = src[src["mode"] == mode].copy()
              d.to_csv(
                  root / "outputs_CHELSA21K" / f"model_{mode}" / "summary_timeseries.csv",
                  index=False, encoding="utf-8-sig",
              )
          PY

          PYTHONPATH="$ROOT" python - <<'PY'
          from pathlib import Path
          import os
          from pb4studio.figures import make_timeseries_figures

          root = Path(os.environ["ROOT"])
          out = root / "outputs_CHELSA21K"
          figs = make_timeseries_figures(
              out / "model_static",
              out / "model_dynamic",
              out / "PACKAGE_CODE_FIGURES",
          )
          names = {Path(x).name for x in figs}
          required = {
              "timeseries_mean_elevation.png",
              "timeseries_mean_soil_depth.png",
              "timeseries_mean_npp.png",
          }
          assert required.issubset(names), (required, names)
          print("PACKAGE_PLOT_OK", sorted(required))
          PY

          # The requested plots must use the CHELSA template and start at 21 ka.
          grep -q 'color="firebrick", linewidth=1.6' "$ROOT/pb4studio/figures.py"
          grep -q 'color="royalblue", linewidth=1.4' "$ROOT/pb4studio/figures.py"
          grep -q 'set_xlim(21, 0)' "$ROOT/pb4studio/figures.py"
          grep -q 'set_xticks(np.arange(21, -0.1, -3))' "$ROOT/pb4studio/figures.py"
          grep -q 'frameon=False' "$ROOT/pb4studio/figures.py"

          # Remove verification outputs before shipping the user ZIP.
          rm -rf "$ROOT/outputs_CHELSA21K"
          mkdir -p "$ROOT/outputs_CHELSA21K"
          printf '%s\n' \
            '실행 결과는 이 폴더에 생성됩니다.' \
            'RUN_YONGNEUP_21KA_AND_EXPORT_ALL.bat을 실행하십시오.' \
            > "$ROOT/outputs_CHELSA21K/README_RUN_TO_GENERATE.txt"

      - name: Regenerate canonical GitHub plot outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pb4_chelsa21k/plots/package_generated
          python pb4_chelsa21k/plots/plot_mean_elevation.py
          python pb4_chelsa21k/plots/plot_mean_soil_depth.py
          python pb4_chelsa21k/plots/plot_mean_npp.py

      - name: Replace canonical ZIP and remove duplicate aliases
        shell: bash
        run: |
          set -euo pipefail
          rm -f pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip
          rm -f pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip
          rm -f pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip

          (
            cd /tmp/pb4_clean_build
            zip -q -X -r "$GITHUB_WORKSPACE/pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip" "$(basename "$ROOT")"
          )

          sha=$(sha256sum pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip | awk '{print $1}')
          echo "PACKAGE_SHA=$sha" >> "$GITHUB_ENV"
          echo "NEW_PACKAGE_SHA=$sha"

          python - <<'PY'
          from pathlib import Path
          import json, os

          sha = os.environ["PACKAGE_SHA"]
          sums = Path("pb4_chelsa21k/SHA256SUMS.txt")
          lines = sums.read_text(encoding="utf-8").splitlines()
          kept = [
              x for x in lines
              if "model/PB4Studio_v6.6.3_CHELSA21K.zip" not in x
              and "model/PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip" not in x
              and "model/PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip" not in x
          ]
          sums.write_text(
              f"{sha}  model/PB4Studio_v6.6.3_CHELSA21K.zip\n" + "\n".join(kept) + "\n",
              encoding="utf-8",
          )

          prov_path = Path("pb4_chelsa21k/results/final_integrated_20261006/FINAL_PROVENANCE.json")
          p = json.loads(prov_path.read_text(encoding="utf-8"))
          old = p.get("final_sha256")
          p["previous_packaging_sha256"] = old
          p["final_sha256"] = sha
          p["model_version"] = "6.6.3-CHELSA21K-FINAL-nativeClimate-BIOME4AGB-U008"
          p["packaging_update_20261006"] = (
              "science equations unchanged; fixed GUI version contract, "
              "211-step FULL_EXPORT packaging, CHELSA-style 21->0 ka plots, "
              "and removed stale audit/debug/reference baggage"
          )
          prov_path.write_text(json.dumps(p, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit cleaned canonical package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pb4_chelsa21k
          git status --short
          git commit -m "fix: clean U008 package and unify 21 ka plots with CHELSA style"
          git push
