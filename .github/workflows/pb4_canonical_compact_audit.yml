name: PB4 canonical compact audit
on:
  push:
    paths:
      - '.github/workflows/pb4_canonical_compact_audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current canonical source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip
          echo "SHA256=$(sha256sum "$ZIP" | awk '{print $1}')"
          rm -rf /tmp/pb4compact && mkdir -p /tmp/pb4compact
          unzip -q "$ZIP" -d /tmp/pb4compact
          ROOT="$(find /tmp/pb4compact -maxdepth 1 -type d -name 'PB4Studio*' | head -n1)"
          B="$ROOT/pb4studio/biome4_backend.py"
          F="$ROOT/fortran_src/biome4_original_4_2b2.f"
          echo "=== FORTRAN PATCH FUNCTIONS ==="
          grep -nE '^def .*patch|\.replace\(|PFT5|PFT6|Sitch|BoNE|BONE|tcm|gdd' "$B" | head -n 300 || true
          echo "=== PFT PARAMETER ORIGINAL ==="
          grep -nA45 'subroutine pftdata' "$F" | head -n 70
          echo "=== CLIMATE LIMIT ORIGINAL CONSTRAINTS ==="
          grep -nA120 'subroutine constraints' "$F" | head -n 150
          echo "=== RUN MODES ==="
          grep -RniE 'static|dynamic|geomorph.*enabled|run_geomorph|update_pelletier' "$ROOT/pb4studio/runner.py" | head -n 220 || true
