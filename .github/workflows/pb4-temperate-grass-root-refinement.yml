name: Test temperate-grass root refinement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-temperate-grass-root-refinement.yml'
      - 'pb4_chelsa21k/tools/test_temperate_grass_root_refinement.py'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate

      - name: Run candidate experiment
        shell: bash
        run: |
          set -euo pipefail
          python pb4_chelsa21k/tools/test_temperate_grass_root_refinement.py

      - name: Commit candidate outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/results/temperate_grass_candidate_20261006
          if [ -f pb4_chelsa21k/model_candidates/PB4Studio_v6.6.3_CHELSA21K_JACKSON_LIFEFORM_SUB30_GRASS_CANDIDATE.zip ]; then
            git add pb4_chelsa21k/model_candidates/PB4Studio_v6.6.3_CHELSA21K_JACKSON_LIFEFORM_SUB30_GRASS_CANDIDATE.zip
          fi
          git status --short
          git commit -m 'Test Jackson life-form shallow-root temperate-grass candidate [skip ci]' || exit 0
          git push origin HEAD:main
