name: Detailed PFT8 threshold 2.70

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-pft8-th270-detailed.yml'
      - 'pb4_chelsa21k/tools/run_pft8_th270_detailed.py'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate
      - name: Run detailed candidate
        run: python pb4_chelsa21k/tools/run_pft8_th270_detailed.py
      - name: Commit results
        run: |
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/results/pft8_threshold_selected_20261006
          git commit -m 'Save detailed PFT8 threshold 2.70 candidate [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
