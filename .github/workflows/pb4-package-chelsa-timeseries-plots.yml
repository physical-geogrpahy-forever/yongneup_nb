name: PB4 package CHELSA-style timeseries plots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-package-chelsa-timeseries-plots.yml'

permissions:
  contents: write

jobs:
  patch-render-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install plotting runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python -m pip install -q numpy pandas matplotlib rasterio

      - name: Unpack current PB4 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4_chelsa_plots
          mkdir -p /tmp/pb4_chelsa_plots
          unzip -q pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip -d /tmp/pb4_chelsa_plots
          root=$(find /tmp/pb4_chelsa_plots -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          test -n "$root"
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Patch package plotting code only
        shell: bash
        run: |
          set -euo pipefail
          python pb4_chelsa21k/tools/patch_package_chelsa_plots.py "$ROOT"
          mkdir -p "$ROOT/plots"
          cp pb4_chelsa21k/plots/plot_chelsa_climate.py "$ROOT/plots/plot_chelsa_climate.py"
          cp pb4_chelsa21k/plots/plot_mean_elevation.py "$ROOT/plots/plot_mean_elevation.py"
          cp pb4_chelsa21k/plots/plot_mean_soil_depth.py "$ROOT/plots/plot_mean_soil_depth.py"
          cp pb4_chelsa21k/plots/plot_mean_npp.py "$ROOT/plots/plot_mean_npp.py"

      - name: Feed existing U008 results to package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/outputs_CHELSA21K/model_static" "$ROOT/outputs_CHELSA21K/model_dynamic"
          mkdir -p "$ROOT/results/final_integrated_20261006"
          cp pb4_chelsa21k/results/final_integrated_20261006/FINAL_AGB_21KA_TIMESERIES.csv              "$ROOT/results/final_integrated_20261006/FINAL_AGB_21KA_TIMESERIES.csv"

          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          root = Path(os.environ["ROOT"])
          src = pd.read_csv(
              "pb4_chelsa21k/results/final_integrated_20261006/FINAL_AGB_21KA_TIMESERIES.csv",
              encoding="utf-8-sig",
          )
          for mode in ("static", "dynamic"):
              d = src[src["mode"] == mode].copy()
              d = d.drop(columns=[c for c in ("mode", "source_csv") if c in d.columns])
              d.to_csv(
                  root / "outputs_CHELSA21K" / f"model_{mode}" / "summary_timeseries.csv",
                  index=False,
                  encoding="utf-8-sig",
              )
          PY

      - name: Run package plotting code on existing results
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python - <<'PY'
          from pathlib import Path
          from pb4studio.figures import make_timeseries_figures

          root = Path(".").resolve()
          out = root / "outputs_CHELSA21K"
          figdir = out / "PACKAGE_CODE_FIGURES"
          paths = make_timeseries_figures(
              out / "model_static",
              out / "model_dynamic",
              figdir,
              static_label="정적모델",
              dynamic_label="동적모델",
          )
          print("PACKAGE_CODE_OUTPUTS")
          for p in paths:
              print(p)
          PY

          python plots/plot_mean_elevation.py
          python plots/plot_mean_soil_depth.py
          python plots/plot_mean_npp.py

          test -f outputs_CHELSA21K/PACKAGE_CODE_FIGURES/timeseries_mean_elevation.png
          test -f outputs_CHELSA21K/PACKAGE_CODE_FIGURES/timeseries_mean_soil_depth.png
          test -f outputs_CHELSA21K/PACKAGE_CODE_FIGURES/timeseries_mean_npp.png

      - name: Save package-generated plots to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pb4_chelsa21k/plots/package_generated
          cp "$ROOT/outputs_CHELSA21K/PACKAGE_CODE_FIGURES/timeseries_mean_elevation.png" pb4_chelsa21k/plots/package_generated/timeseries_mean_elevation.png
          cp "$ROOT/outputs_CHELSA21K/PACKAGE_CODE_FIGURES/timeseries_mean_soil_depth.png" pb4_chelsa21k/plots/package_generated/timeseries_mean_soil_depth.png
          cp "$ROOT/outputs_CHELSA21K/PACKAGE_CODE_FIGURES/timeseries_mean_npp.png" pb4_chelsa21k/plots/package_generated/timeseries_mean_npp.png

          cp "$ROOT/plots/YONGNEUP_U008_mean_elevation_CHELSA_style.png" pb4_chelsa21k/plots/package_generated/YONGNEUP_U008_mean_elevation_CHELSA_style.png
          cp "$ROOT/plots/YONGNEUP_U008_mean_soil_depth_CHELSA_style.png" pb4_chelsa21k/plots/package_generated/YONGNEUP_U008_mean_soil_depth_CHELSA_style.png
          cp "$ROOT/plots/YONGNEUP_U008_mean_npp_CHELSA_style.png" pb4_chelsa21k/plots/package_generated/YONGNEUP_U008_mean_npp_CHELSA_style.png

      - name: Build plot-updated PB4 package
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pb4_chelsa_plots
          root_name=$(basename "$ROOT")
          zip -q -r /tmp/PB4Studio_v6.6.3_CHELSA21K_U008_CHELSA_PLOTS.zip "$root_name"
          sha256sum /tmp/PB4Studio_v6.6.3_CHELSA21K_U008_CHELSA_PLOTS.zip > /tmp/PB4Studio_v6.6.3_CHELSA21K_U008_CHELSA_PLOTS.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PB4_U008_CHELSA_PLOTS_PACKAGE_AND_OUTPUTS
          path: |
            /tmp/PB4Studio_v6.6.3_CHELSA21K_U008_CHELSA_PLOTS.zip
            /tmp/PB4Studio_v6.6.3_CHELSA21K_U008_CHELSA_PLOTS.sha256
            pb4_chelsa21k/plots/package_generated/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit package-generated plots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/plots/package_generated
          git rm .github/workflows/pb4-package-chelsa-timeseries-plots.yml
          git commit -m 'plots: save PB4 package-generated CHELSA-style time series [skip ci]'
          git push origin HEAD:main
