name: TREED transient runtime audit

on:
  push:
    branches: [feature/treed-transient-yongneup-20260902]
    paths:
      - 'diagnostics/treed_transient_runtime_audit.jl'
      - '.github/workflows/treed-transient-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PAYLOAD_SHA256: 555d2c7abcea6a8d0b6192fee47b6f421af170313a6043b11c8bf978659cddc8
  JULIA_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct audited production model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p treed120
          cat treed120_payload_v2/chunk_*.b64 | base64 -d > /tmp/treed120_pkg.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/treed120_pkg.tar.gz" | sha256sum -c -
          tar xzf /tmp/treed120_pkg.tar.gz -C treed120
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11.6'
      - uses: julia-actions/cache@v3
      - name: Instantiate pinned TREED environment
        shell: bash
        run: |
          julia --project=treed120 -e '
            using Pkg
            Pkg.instantiate()
            pins=[
              PackageSpec(name="Optimization",version="5.5.0"),
              PackageSpec(name="OptimizationBase",version="5.0.0"),
              PackageSpec(name="OptimizationMetaheuristics",version="0.3.5"),
              PackageSpec(name="Metaheuristics",version="3.4.2"),
              PackageSpec(name="SciMLBase",version="2.139.0"),
              PackageSpec(name="SciMLLogging",version="1.9.0")]
            Pkg.add(pins); foreach(Pkg.pin,pins); Pkg.resolve(); Pkg.precompile()
          '
      - name: Apply production compatibility patch
        run: python scripts/patch_direct_agb_v2.py
      - name: Audit transient primitives and landscape scale
        run: julia --project=treed120 diagnostics/treed_transient_runtime_audit.jl treed120 | tee treed_transient_runtime_audit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: treed-transient-runtime-audit
          path: treed_transient_runtime_audit.txt
          retention-days: 30
