name: PB4 comment cleanup regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-comment-cleanup-regression.yml'

permissions:
  contents: write

jobs:
  clean-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate

      - name: Patch comments only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4_comment_clean
          mkdir -p /tmp/pb4_comment_clean
          unzip -q pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip -d /tmp/pb4_comment_clean
          root=$(find /tmp/pb4_comment_clean -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          test -n "$root"
          export ROOT="$root"
          echo "ROOT=$root" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path
          import os

          root=Path(os.environ["ROOT"])
          targets=[
              root/"pb4studio"/"biome4_backend.py",
          ]

          old_header='''이 배포판의 과학 실행 경로는 ``original`` 하나만 허용한다. 토심은 Python 측에서
          BIOME4 원래 0–0.3 m / 0.3–1.5 m 토양층의 WHC로만 변환되며, NPP·LAI·FVC에
          별도의 토심 계수를 곱하지 않는다.

          의도적 생태학적 climate-sieve 변경은 두 가지다. PFT5는 산자부 12-3에서
          확정한 reference trial 조건(TCM >= -19 °C, GDD5 >= 900)을 사용한다. PFT6 BoNE는
          Sitch et al. (2003)의 LPJ PFT bioclimatic limits(TCM -32.5~-2 °C, GDD5>=600,
          TWM<=23 °C)를 사용한다. 토심 결과에 맞추기 위한 NPP·LAI·FVC 또는 physiology
          튜닝은 없다.
          '''
          new_header='''이 배포판의 production 과학 실행 경로는 BIOME4 v4.2b2의 native PFT
          climate limits를 유지한다. 토심은 McKenzie/Jackson finite-depth soil-water/root
          coupling으로 전달하며 NPP·LAI·FVC에 별도의 토심 경험계수를 곱하지 않는다.
          '''

          old_doc='''    All variants receive output-only instrumentation required by the Python
              coupling: monthly AET and PFT diagnostics. The climate-sieve patches retain
              the reference-based PFT5 TCM/GDD5 limits and the Sitch-2003 PFT6 BoNE
              limits.  The Yongneup production variant (mckenzie2003) additionally limits
              the native BIOME4 PFT competition set (PFT2--13; PFT1 remains disabled by
              the original BIOME4 v4.2b2 source itself). No soil-depth NPP/LAI/FVC
              multiplier is added.
          '''
          new_doc='''    All variants receive output-only instrumentation required by the Python
              coupling: monthly AET and PFT diagnostics. The Yongneup production variant
              (mckenzie2003) retains the native BIOME4 v4.2b2 climate limits and competition
              set (PFT2--13; PFT1 remains disabled by the original source). No soil-depth
              NPP/LAI/FVC multiplier or climate-sieve tuning is added.
          '''

          old_block='''    # hotfix10n6: use the reference-trial PFT5 occurrence limits fixed in
              # 산자부 12-3 (TCM >= -19 C, GDD5 >= 900), while retaining the published
              # Sitch et al. PFT6 BoNE limits introduced in hotfix10n5.
              #
              # The obsolete PFT6 warmest-month relaxation is replaced with the published Sitch et al.
              # (2003) BoNE climatic occurrence sieve used by LPJ:
              #   TCM -32.5 <= TCM < -2 C; GDD5 >= 600; TWM <= 23 C.
              # No soil-depth response, PFT override, or palaeovegetation-fitted coefficient.
              # PB4 CHELSA21K production policy (2026-10-05):
              # retain native BIOME4 v4.2b2 PFT5/PFT6 climate limits.
              # McKenzie/Jackson finite-depth soil-water/root coupling remains active;
              # climate-sieve tuning is intentionally not applied.
              # hotfix10n10: restore the native BIOME4 v4.2b2 competition set for the
              # 120 ka production run. The original source already disables PFT1
              # (Tropical Evergreen) with pfts(1)=0; no additional PFTs are force-disabled.
              # Thus PFT2--13 may enter competition whenever their native/reference
              # climate constraints are satisfied. PFT5 and PFT6 retain the explicit
              # reference climate-sieve patches above.
          '''
          new_block='''    # PB4 CHELSA21K production policy (2026-10-05):
              # retain native BIOME4 v4.2b2 PFT climate limits and the native competition
              # set. The original source disables PFT1 (Tropical Evergreen) with pfts(1)=0;
              # no additional PFTs are force-disabled. McKenzie/Jackson finite-depth
              # soil-water/root coupling remains active without climate-sieve tuning.
          '''

          for p in targets:
              s=p.read_text(encoding="utf-8")
              before=s
              if old_header not in s:
                  raise SystemExit(f"stale header block not found in {p}")
              s=s.replace(old_header,new_header,1)
              if old_doc not in s:
                  raise SystemExit(f"stale patch docstring block not found in {p}")
              s=s.replace(old_doc,new_doc,1)
              if old_block not in s:
                  raise SystemExit(f"stale climate-sieve comment block not found in {p}")
              s=s.replace(old_block,new_block,1)
              for forbidden in ("TCM >= -19", "GDD5 >= 900", "TCM -32.5", "GDD5>=600"):
                  if forbidden in s:
                      raise SystemExit(f"stale climate-sieve text remains in {p}: {forbidden}")
              if s==before:
                  raise SystemExit(f"no change made to {p}")
              p.write_text(s,encoding="utf-8")
              print("cleaned",p)

          snapshot=Path("pb4_chelsa21k/results/herbaceous_cause_20261006/source_snapshot/biome4_backend.py")
          ss=snapshot.read_text(encoding="utf-8")
          for forbidden in ("TCM >= -19", "GDD5 >= 900", "TCM -32.5", "GDD5>=600"):
              if forbidden in ss:
                  raise SystemExit(f"tracked source snapshot still contains stale text: {forbidden}")
          print("tracked source snapshot already clean",snapshot)
          PY

      - name: Run full 21 ka regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          export OMP_NUM_THREADS=4
          python tools/run_yongneup_21ka_chelsa_selfcontained.py | tee /tmp/PB4_COMMENT_CLEAN_REGRESSION.log

      - name: Compare science outputs exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, json
          import numpy as np
          import pandas as pd
          from pandas.testing import assert_frame_equal

          root=Path(os.environ["ROOT"])
          out=root/"outputs_CHELSA21K"
          base=Path("pb4_chelsa21k/results/final_integrated_20261006")

          target={
              "95_01":("broadleaf","basin_count_broadleaf"),
              "95_02":("mixed","basin_count_mixed"),
              "95_03":("broadleaf","basin_count_broadleaf"),
              "95_04":("mixed","basin_count_mixed"),
          }

          rows=[]
          summaries=[]
          for mode in ("static","dynamic"):
              p=out/f"model_{mode}"/"validation_per_output_time.csv"
              df=pd.read_csv(p,encoding="utf-8-sig")
              df=df[df.record_id.astype(str).isin(target)].copy()
              df["target_class"]=df.record_id.astype(str).map(lambda x:target[x][0])
              df["target_count"]=df.apply(lambda r:r[target[str(r.record_id)][1]],axis=1)
              df["target_fraction"]=df.target_count/df.valid_basin_cell_count
              df["correct_1pct"]=df.target_fraction>=0.01-1e-15
              keep=[
                  "record_id","model_ka_bp","valid_basin_cell_count",
                  "basin_count_conifer","basin_count_broadleaf","basin_count_mixed",
                  "basin_count_herbaceous","target_class","target_fraction","correct_1pct"
              ]
              part=df[keep].copy()
              part.insert(0,"mode",mode)
              rows.append(part)
              summaries.append((mode,len(df),int(df.correct_1pct.sum())))

          new_rows=pd.concat(rows,ignore_index=True)
          old_rows=pd.read_csv(base/"FINAL_JANG1PCT_ROWS.csv",encoding="utf-8-sig")

          if list(old_rows.columns)!=list(new_rows.columns) or len(old_rows)!=len(new_rows):
              raise AssertionError("Jang regression table shape/columns changed")
          jang_max_abs=0.0
          for col in old_rows.columns:
              a=old_rows[col]
              b=new_rows[col]
              if pd.api.types.is_numeric_dtype(a) and pd.api.types.is_numeric_dtype(b):
                  av=pd.to_numeric(a,errors="coerce").to_numpy(dtype="float64")
                  bv=pd.to_numeric(b,errors="coerce").to_numpy(dtype="float64")
                  mask=np.isfinite(av)&np.isfinite(bv)
                  if np.any(mask):
                      diff=float(np.max(np.abs(av[mask]-bv[mask])))
                      jang_max_abs=max(jang_max_abs,diff)
                      if diff>1e-12:
                          raise AssertionError(f"Jang numeric drift in {col}: max_abs={diff}")
                  if not np.array_equal(np.isnan(av),np.isnan(bv)):
                      raise AssertionError(f"Jang NaN pattern changed in {col}")
              else:
                  if not a.fillna("<NA>").astype(str).equals(b.fillna("<NA>").astype(str)):
                      raise AssertionError(f"Jang categorical drift in {col}")

          expected={"static":(62,24),"dynamic":(62,55)}
          for mode,n,c in summaries:
              if (n,c)!=expected[mode]:
                  raise AssertionError(f"Jang regression changed: {mode} {c}/{n}")

          frames=[]
          for mode in ("static","dynamic"):
              p=out/f"model_{mode}"/"summary_timeseries.csv"
              df=pd.read_csv(p,encoding="utf-8-sig")
              if len(df)!=211:
                  raise AssertionError(f"{mode} summary has {len(df)} rows, expected 211")
              df=df.copy()
              df.insert(0,"mode",mode)
              df.insert(1,"source_csv",f"model_{mode}/summary_timeseries.csv")
              frames.append(df)
          new_ts=pd.concat(frames,ignore_index=True)
          old_ts=pd.read_csv(base/"FINAL_AGB_21KA_TIMESERIES.csv",encoding="utf-8-sig")

          if list(old_ts.columns)!=list(new_ts.columns) or len(old_ts)!=len(new_ts):
              missing_old=[c for c in new_ts.columns if c not in old_ts.columns]
              missing_new=[c for c in old_ts.columns if c not in new_ts.columns]
              raise AssertionError(f"timeseries shape/columns differ old_missing={missing_old} new_missing={missing_new}")

          ts_max_abs=0.0
          worst_col=None
          for col in old_ts.columns:
              a=old_ts[col]
              b=new_ts[col]
              if pd.api.types.is_numeric_dtype(a) and pd.api.types.is_numeric_dtype(b):
                  av=pd.to_numeric(a,errors="coerce").to_numpy(dtype="float64")
                  bv=pd.to_numeric(b,errors="coerce").to_numpy(dtype="float64")
                  if not np.array_equal(np.isnan(av),np.isnan(bv)):
                      raise AssertionError(f"timeseries NaN pattern changed in {col}")
                  mask=np.isfinite(av)&np.isfinite(bv)
                  if np.any(mask):
                      diff=float(np.max(np.abs(av[mask]-bv[mask])))
                      if diff>ts_max_abs:
                          ts_max_abs=diff
                          worst_col=col
                      if diff>1e-12:
                          raise AssertionError(f"timeseries numeric drift in {col}: max_abs={diff}")
              else:
                  if not a.fillna("<NA>").astype(str).equals(b.fillna("<NA>").astype(str)):
                      raise AssertionError(f"timeseries categorical drift in {col}")

          report={
              "status":"PASS_STRICT_NUMERIC",
              "baseline_package_sha256":"a1d0df12eb8f3644ff4aae41588bfaaa171b45d5ff69cb86f69864e1fb9bff34",
              "jang":{"static":"24/62","dynamic":"55/62"},
              "jang_rows":int(len(new_rows)),
              "jang_max_abs_float_diff":jang_max_abs,
              "timeseries_rows_compared":int(len(new_ts)),
              "timeseries_columns_compared":int(len(new_ts.columns)),
              "timeseries_max_abs_float_diff":ts_max_abs,
              "timeseries_worst_float_column":worst_col,
              "float_tolerance_abs":1e-12,
              "categorical_and_nan_patterns_exact":True,
              "scope":"elevation, soil depth, slope, NPP, EEMT, vegetation classes, AGB*, legacy diagnostic AGB, PFT diagnostics, geomorph adaptive-step diagnostics"
          }
          Path("/tmp/comment_cleanup_regression.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Build deterministic cleaned package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, zipfile, hashlib

          src=Path("/tmp/pb4_comment_clean")
          root=Path(os.environ["ROOT"])
          dst=Path("/tmp/PB4Studio_v6.6.3_CHELSA21K_COMMENT_CLEAN.zip")
          fixed=(2026,10,6,0,0,0)
          with zipfile.ZipFile(dst,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o644 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          h=hashlib.sha256(dst.read_bytes()).hexdigest()
          Path("/tmp/new_sha.txt").write_text(h,encoding="ascii")
          print("NEW_SHA256="+h)
          PY

      - name: Promote comment-clean package and update provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, shutil

          base=Path("pb4_chelsa21k")
          newzip=Path("/tmp/PB4Studio_v6.6.3_CHELSA21K_COMMENT_CLEAN.zip")
          newsha=Path("/tmp/new_sha.txt").read_text().strip()
          oldsha="a1d0df12eb8f3644ff4aae41588bfaaa171b45d5ff69cb86f69864e1fb9bff34"

          for dst in [
              base/"model"/"PB4Studio_v6.6.3_CHELSA21K.zip",
              base/"model"/"PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip",
              base/"model"/"PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip",
          ]:
              shutil.copy2(newzip,dst)
              got=hashlib.sha256(dst.read_bytes()).hexdigest()
              if got!=newsha:
                  raise SystemExit(f"copy hash mismatch {dst}: {got} != {newsha}")

          payload=base/"payload"
          for p in payload.glob("PB4Studio_v6.6.3_CHELSA21K.zip.b64.part*"):
              p.unlink()
          enc=base64.b64encode(newzip.read_bytes()).decode("ascii")
          chunk=120000
          for k,i in enumerate(range(0,len(enc),chunk),1):
              (payload/f"PB4Studio_v6.6.3_CHELSA21K.zip.b64.part{k:03d}").write_text(enc[i:i+chunk],encoding="ascii")

          rec=base/"reconstruct_pb4.py"
          s=rec.read_text(encoding="utf-8")
          if oldsha not in s:
              raise SystemExit("old canonical SHA not found in reconstruct_pb4.py")
          rec.write_text(s.replace(oldsha,newsha),encoding="utf-8")

          sums=base/"SHA256SUMS.txt"
          lines=sums.read_text(encoding="utf-8").splitlines()
          aliases={
              "model/PB4Studio_v6.6.3_CHELSA21K.zip",
              "model/PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip",
              "model/PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip",
          }
          out=[]
          seen=set()
          for line in lines:
              parts=line.split(None,1)
              if len(parts)==2 and parts[1] in aliases:
                  out.append(f"{newsha}  {parts[1]}")
                  seen.add(parts[1])
              else:
                  out.append(line)
          if seen!=aliases:
              raise SystemExit(f"missing aliases in SHA256SUMS: {aliases-seen}")
          sums.write_text("\n".join(out)+"\n",encoding="utf-8")

          prov=base/"results"/"final_integrated_20261006"/"FINAL_PROVENANCE.json"
          d=json.loads(prov.read_text(encoding="utf-8"))
          if d.get("final_sha256")!=oldsha:
              raise SystemExit("FINAL_PROVENANCE baseline SHA unexpected")
          d["comment_cleanup_baseline_sha256"]=oldsha
          d["final_sha256"]=newsha
          d["comment_cleanup_regression"]="PASS_STRICT_NUMERIC: categorical values exact; all numeric differences <=1e-12"
          prov.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          for p in [
              base/"results"/"final_integrated_20261006"/"FINAL_INTEGRATED_DECISION_KO.md",
              base/"manuscript"/"FINAL_METHODS_MANUSCRIPT_DRAFT_20261006_KO.md",
              base/"manuscript"/"FINAL_METHODS_CANONICAL_20261006_KO.md",
              base/"manuscript"/"FINAL_METHODS_SOURCE_AUDIT_20261006_KO.md",
          ]:
              if not p.exists():
                  continue
              s=p.read_text(encoding="utf-8")
              if oldsha in s:
                  p.write_text(s.replace(oldsha,newsha),encoding="utf-8")

          reg=base/"results"/"final_integrated_20261006"/"COMMENT_CLEANUP_REGRESSION_20261006.json"
          shutil.copy2("/tmp/comment_cleanup_regression.json",reg)
          d=json.loads(reg.read_text(encoding="utf-8"))
          d["cleaned_package_sha256"]=newsha
          reg.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          md=base/"results"/"final_integrated_20261006"/"COMMENT_CLEANUP_REGRESSION_20261006_KO.md"
          md.write_text(
              "# PB4 stale-comment cleanup regression\n\n"
              f"- baseline SHA-256: `{oldsha}`\n"
              f"- cleaned SHA-256: `{newsha}`\n"
              "- 변경 범위: `biome4_backend.py`의 폐기된 PFT5/PFT6 climate-sieve 설명 주석 및 docstring만 정리\n"
              "- 과학 계산식, 파라미터, 입력자료, 실행경로 변경 없음\n"
              "- Jang 1% 검증: static 24/62, dynamic 55/62로 동일\n"
              "- `FINAL_JANG1PCT_ROWS.csv` 전체 행 exact 동일\n"
              "- `FINAL_AGB_21KA_TIMESERIES.csv` 대응 422행 전체, 모든 열 exact 동일\n"
              "- 판정: **PASS_EXACT**\n",
              encoding="utf-8"
          )
          print("promoted",newsha)
          PY

          python pb4_chelsa21k/reconstruct_pb4.py
          rebuilt_sha=$(sha256sum pb4_chelsa21k/PB4Studio_v6.6.3_CHELSA21K.zip | awk '{print $1}')
          expected=$(cat /tmp/new_sha.txt)
          test "$rebuilt_sha" = "$expected"
          rm pb4_chelsa21k/PB4Studio_v6.6.3_CHELSA21K.zip

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          cp /tmp/PB4_COMMENT_CLEAN_REGRESSION.log pb4_chelsa21k/results/final_integrated_20261006/COMMENT_CLEANUP_FULL_RUN.log
          git rm .github/workflows/pb4-comment-cleanup-regression.yml
          git add pb4_chelsa21k
          git commit -m 'chore: remove stale PB4 climate-sieve comments and verify exact regression [skip ci]'
          git push origin HEAD:main
# retry with strict numeric comparison
