name: TREED Yongneup transient coupled smoke

on:
  push:
    branches: [feature/treed-transient-yongneup-20260902]
    paths:
      - 'diagnostics/run_transient_smoke.jl'
      - '.github/workflows/treed-transient-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PAYLOAD_SHA256: 555d2c7abcea6a8d0b6192fee47b6f421af170313a6043b11c8bf978659cddc8
  JULIA_NUM_THREADS: '1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct audited production model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p treed120
          cat treed120_payload_v2/chunk_*.b64 | base64 -d > /tmp/treed120_pkg.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/treed120_pkg.tar.gz" | sha256sum -c -
          tar xzf /tmp/treed120_pkg.tar.gz -C treed120
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy rasterio matplotlib
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11.6'
      - uses: julia-actions/cache@v3
      - name: Instantiate pinned TREED environment
        shell: bash
        run: |
          julia --project=treed120 -e '
            using Pkg
            Pkg.instantiate()
            pins=[
              PackageSpec(name="Optimization",version="5.5.0"),
              PackageSpec(name="OptimizationBase",version="5.0.0"),
              PackageSpec(name="OptimizationMetaheuristics",version="0.3.5"),
              PackageSpec(name="Metaheuristics",version="3.4.2"),
              PackageSpec(name="SciMLBase",version="2.139.0"),
              PackageSpec(name="SciMLLogging",version="1.9.0")]
            Pkg.add(pins); foreach(Pkg.pin,pins); Pkg.resolve(); Pkg.precompile()
          '
      - name: Apply production direct-AGB compatibility patch
        run: |
          python scripts/patch_direct_agb_v2.py
          python -m py_compile treed120/python/run_geomorph_step.py
      - name: Parse transient runner
        run: julia --project=treed120 -e 'Meta.parseall(read("diagnostics/run_transient_smoke.jl",String)); println("TRANSIENT_SMOKE_PARSE_OK")'
      - name: Run 120 to 119 ka coupled transient smoke
        run: |
          julia --project=treed120 diagnostics/run_transient_smoke.jl treed120 1.0 0.0 transient_smoke_out | tee transient_smoke.log
      - name: Validate transient outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np, pandas as pd
          root=Path('transient_smoke_out')
          required=['trait_transition_120_to_119.csv','summary_119.csv','monthly_119.csv','metrics_120.csv','metrics_119.csv','snapshot_119ka.csv']
          for f in required:
              p=root/f
              assert p.is_file(), f'missing {p}'
          tr=pd.read_csv(root/'trait_transition_120_to_119.csv')
          s=pd.read_csv(root/'summary_119.csv')
          snap=pd.read_csv(root/'snapshot_119ka.csv')
          assert len(tr)==298, len(tr)
          assert len(s)==298, len(s)
          assert len(snap)==298, len(snap)
          for c in ['H_120','H_119','a_ll_120','a_ll_119','C_leaf_120','C_leaf_119']:
              assert np.all(np.isfinite(tr[c].to_numpy(float))), c
          assert np.all(tr.H_119.to_numpy(float)>=0)
          assert np.all(tr.a_ll_119.to_numpy(float)>0)
          assert np.all(tr.C_leaf_119.to_numpy(float)>0)
          for c in ['AGB_C_g_m2_component_sum','NPP_gC_m2_yr','AET_mm_yr','LAI','FPC','latent_H_m','latent_a_ll_yr','latent_C_leaf_gC_individual']:
              assert c in s.columns, c
              assert np.all(np.isfinite(s[c].to_numpy(float))), c
          assert np.all(s.AGB_C_g_m2_component_sum.to_numpy(float)>=0)
          # The coupled 119-ka state must be an actual model evaluation, not a copied frame.
          changed=(np.abs(tr.dH.to_numpy(float))>1e-12)|(np.abs(tr.da_ll.to_numpy(float))>1e-12)|(np.abs(tr.dC_leaf.to_numpy(float))>1e-9)
          assert changed.any(), 'all transient traits were unchanged'
          # No dispersal test means each cell may only draw from itself; this isolates evolution/coupling plumbing.
          log=Path('transient_smoke.log').read_text()
          assert 'neighbor_count_min=1' in log and 'max=1' in log, log[-2000:]
          assert 'TRANSIENT_SMOKE_OK' in log
          print('TREED_TRANSIENT_COUPLED_SMOKE_VALIDATION_OK',
                'changed_cells=',int(changed.sum()),
                'mean_H_120=',float(tr.H_120.mean()),
                'mean_H_119=',float(tr.H_119.mean()),
                'mean_abs_da_ll=',float(np.abs(tr.da_ll).mean()),
                'mean_abs_dC_leaf=',float(np.abs(tr.dC_leaf).mean()))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: treed-transient-coupled-smoke
          path: |
            transient_smoke_out/
            transient_smoke.log
          retention-days: 30
