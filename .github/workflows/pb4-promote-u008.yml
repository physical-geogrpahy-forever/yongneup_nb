name: PB4 promote U008

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-promote-u008.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate

      - name: Prepare corrected U008 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4_u008_promote
          mkdir -p /tmp/pb4_u008_promote
          cp pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip /tmp/U020_BASELINE.zip
          unzip -q /tmp/U020_BASELINE.zip -d /tmp/pb4_u008_promote
          root=$(find /tmp/pb4_u008_promote -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          test -n "$root"
          export ROOT="$root"
          echo "ROOT=$root" >> "$GITHUB_ENV"

          python - <<'PY'
          from pathlib import Path
          import os

          root=Path(os.environ["ROOT"])

          p=root/"pb4studio"/"pelletier_geomorph.py"
          s=p.read_text(encoding="utf-8")
          old="    uplift_m_per_kyr: float = 0.20"
          new="    uplift_m_per_kyr: float = 0.08"
          if old not in s:
              raise SystemExit("Expected canonical U=0.20 default not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")

          p=root/"pb4studio"/"config.py"
          s=p.read_text(encoding="utf-8")
          old="(동해안 융기율 참고값, 0.2 m/kyr = 0.2 mm/yr)."
          new="(태백산맥 장기 삭박율 기반 regional forcing, 0.08 m/kyr = 0.08 mm/yr)."
          if old not in s:
              raise SystemExit("Expected old uplift help text not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")

          note=root/"UPLIFT_U008_FINAL_2026-10-06.md"
          note.write_text(
              "# Final uplift setting\n\n"
              "- Production uplift: U = 0.08 m kyr^-1 = 80 mm kyr^-1.\n"
              "- Rationale: Lee et al. (2024), Earth Surface Dynamics 12, 1091-1120, "
              "used 80 mm kyr^-1 as the long-term regional uplift forcing, chosen to equal "
              "the ca. 22 Ma-to-present Taebaek Mountain exhumation rate.\n"
              "- This is a regional model forcing, not a direct Yongneup uplift measurement.\n"
              "- Previous canonical U=0.20 m kyr^-1 is archived for provenance.\n",
              encoding="utf-8"
          )

          out=root/"outputs_CHELSA21K"
          if out.exists():
              import shutil
              shutil.rmtree(out)

          if "uplift_m_per_kyr: float = 0.20" in (root/"pb4studio"/"pelletier_geomorph.py").read_text(encoding="utf-8"):
              raise SystemExit("U020 remains in geomorph source")
          print("U correction prepared")
          PY

      - name: Run full 21 ka corrected production
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          export OMP_NUM_THREADS=4
          python tools/run_yongneup_21ka_chelsa_selfcontained.py | tee /tmp/U008_FINAL_21KA_RUN.log

      - name: Rebuild final science tables and Park holdout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, json, math
          import numpy as np
          import pandas as pd
          from scipy.stats import spearmanr

          root=Path(os.environ["ROOT"])
          out=root/"outputs_CHELSA21K"
          final=Path("pb4_chelsa21k/results/final_integrated_20261006")
          parkdir=Path("pb4_chelsa21k/validation/park2021")

          # Full static/dynamic timeseries.
          frames=[]
          by_mode={}
          for mode in ("static","dynamic"):
              df=pd.read_csv(out/f"model_{mode}"/"summary_timeseries.csv",encoding="utf-8-sig")
              if len(df)!=211:
                  raise SystemExit(f"{mode}: expected 211 rows, got {len(df)}")
              by_mode[mode]=df.copy()
              z=df.copy()
              z.insert(0,"mode",mode)
              z.insert(1,"source_csv",f"model_{mode}/summary_timeseries.csv")
              frames.append(z)
          full=pd.concat(frames,ignore_index=True)
          full.to_csv(final/"FINAL_AGB_21KA_TIMESERIES.csv",index=False,encoding="utf-8-sig")

          # Jang 1% validation.
          target={
              "95_01":("broadleaf","basin_count_broadleaf"),
              "95_02":("mixed","basin_count_mixed"),
              "95_03":("broadleaf","basin_count_broadleaf"),
              "95_04":("mixed","basin_count_mixed"),
          }
          parts=[]
          sums=[]
          for mode in ("static","dynamic"):
              v=pd.read_csv(out/f"model_{mode}"/"validation_per_output_time.csv",encoding="utf-8-sig")
              v=v[v.record_id.astype(str).isin(target)].copy()
              v["target_class"]=v.record_id.astype(str).map(lambda x:target[x][0])
              v["target_count"]=v.apply(lambda r:r[target[str(r.record_id)][1]],axis=1)
              v["target_fraction"]=v.target_count/v.valid_basin_cell_count
              v["correct_1pct"]=v.target_fraction>=0.01-1e-15
              keep=["record_id","model_ka_bp","valid_basin_cell_count",
                    "basin_count_conifer","basin_count_broadleaf","basin_count_mixed",
                    "basin_count_herbaceous","target_class","target_fraction","correct_1pct"]
              q=v[keep].copy()
              q.insert(0,"mode",mode)
              parts.append(q)
              sums.append({
                  "model":"PB4-FINAL-nativeClimate-BIOME4AGB-U008",
                  "mode":mode,"n":len(v),"correct_n":int(v.correct_1pct.sum()),
                  "accuracy_pct":100*float(v.correct_1pct.mean()),
                  "threshold_fraction":0.01,
              })
          jang=pd.concat(parts,ignore_index=True)
          jang.to_csv(final/"FINAL_JANG1PCT_ROWS.csv",index=False,encoding="utf-8-sig")
          js=pd.DataFrame(sums)
          js.to_csv(final/"FINAL_JANG1PCT_SUMMARY.csv",index=False,encoding="utf-8-sig")
          assert [(x["mode"],x["correct_n"],x["n"]) for x in sums]==[("static",24,62),("dynamic",55,62)]

          # AGB summary.
          ag=[]
          for mode in ("dynamic","static"):
              d=by_mode[mode]
              c="reich_lai_sapwood_agb_mean_kg_m2"
              ag.append({
                  "mode":mode,
                  "n_timesteps":len(d),
                  "time_mean_agb_kg_m2":float(d[c].mean()),
                  "min_time_mean_agb_kg_m2":float(d[c].min()),
                  "max_time_mean_agb_kg_m2":float(d[c].max()),
                  "absolute_max_agb_kg_m2":float(d["reich_lai_sapwood_agb_max_kg_m2"].max()),
                  "modern_0ka_agb_kg_m2":float(d.loc[np.isclose(d.ka_bp,0.0),c].iloc[0]),
                  "modern_0ka_agb_t_ha":float(d.loc[np.isclose(d.ka_bp,0.0),c].iloc[0])*10.0,
              })
          pd.DataFrame(ag).to_csv(final/"FINAL_AGB_SUMMARY.csv",index=False,encoding="utf-8-sig")

          # Park 2021 holdout: preserve pollen/window columns, refresh model columns.
          park=pd.read_csv(parkdir/"PARK2021_ZONE2_100YR_HOLDOUT.csv",encoding="utf-8-sig")
          def model_row(mode,ka):
              d=by_mode[mode]
              hit=d.loc[np.isclose(d.ka_bp.astype(float),float(ka))]
              if len(hit)!=1:
                  raise SystemExit(f"{mode} missing unique ka={ka}")
              return hit.iloc[0]
          def pftcount(r,p):
              return float(r.get(f"reich_lai_sapwood_pft{p:02d}_count",0.0))
          static_cold=[]; dynamic_cold=[]; dynamic_temp=[]; dyn_npp=[]; dyn_agb=[]
          for ka in park.ka_bp:
              rs=model_row("static",ka)
              rd=model_row("dynamic",ka)
              def frac(r):
                  cold=sum(pftcount(r,p) for p in (5,6,7))
                  temp=sum(pftcount(r,p) for p in (2,3,4))
                  den=cold+temp
                  return cold/den if den else np.nan
              fs=frac(rs); fd=frac(rd)
              static_cold.append(fs)
              dynamic_cold.append(fd)
              dynamic_temp.append(1.0-fd if np.isfinite(fd) else np.nan)
              dyn_npp.append(float(rd["mean_npp"]))
              dyn_agb.append(float(rd["reich_lai_sapwood_agb_mean_kg_m2"]))
          park["static_model_coldtree_fraction"]=static_cold
          park["dynamic_model_coldtree_fraction"]=dynamic_cold
          park["dynamic_model_temperate_deciduous_fraction"]=dynamic_temp
          park["dynamic_npp"]=dyn_npp
          park["dynamic_agb_kg_m2"]=dyn_agb
          park.to_csv(parkdir/"PARK2021_ZONE2_100YR_HOLDOUT.csv",index=False,encoding="utf-8-sig")

          def sp(a,b):
              z=spearmanr(np.asarray(a,float),np.asarray(b,float),nan_policy="omit")
              return float(z.statistic),float(z.pvalue)
          pc2_dyn=sp(park.park_pc2,park.dynamic_model_coldtree_fraction)
          pc2_sta=sp(park.park_pc2,park.static_model_coldtree_fraction)
          br_dyn=sp(park.pollen_broadleaf_fraction_woody,park.dynamic_model_temperate_deciduous_fraction)
          br_sta=sp(park.pollen_broadleaf_fraction_woody,1.0-park.static_model_coldtree_fraction)

          # Open-PFT check at 2.2-2.7 ka.
          dd=by_mode["dynamic"]
          evt=dd[(dd.ka_bp>=2.2-1e-9)&(dd.ka_bp<=2.7+1e-9)].copy()
          open_count=0.0
          for p in range(8,14):
              col=f"reich_lai_sapwood_pft{p:02d}_count"
              if col in evt:
                  open_count += float(evt[col].sum())

          # Before/after U geomorphic metrics.
          dyn=by_mode["dynamic"]
          sta=by_mode["static"]
          report={
              "uplift_m_per_kyr":0.08,
              "uplift_mm_per_kyr":80.0,
              "jang":{"static":"24/62","dynamic":"55/62"},
              "dynamic":{
                  "mean_elev_21ka":float(dyn.iloc[0].mean_elevation_m),
                  "mean_elev_0ka":float(dyn.iloc[-1].mean_elevation_m),
                  "delta_mean_elev_m":float(dyn.iloc[-1].mean_elevation_m-dyn.iloc[0].mean_elevation_m),
                  "mean_soil_21ka":float(dyn.iloc[0].mean_soil_depth_m),
                  "mean_soil_0ka":float(dyn.iloc[-1].mean_soil_depth_m),
                  "delta_mean_soil_m":float(dyn.iloc[-1].mean_soil_depth_m-dyn.iloc[0].mean_soil_depth_m),
                  "time_mean_npp":float(dyn.mean_npp.mean()),
                  "time_mean_eemt":float(dyn.mean_eemt.mean()),
                  "time_mean_agb":float(dyn.reich_lai_sapwood_agb_mean_kg_m2.mean()),
              },
              "park":{
                  "pc2_dynamic_rho":pc2_dyn[0],"pc2_dynamic_p":pc2_dyn[1],
                  "pc2_static_rho":pc2_sta[0],"pc2_static_p":pc2_sta[1],
                  "broad_dynamic_rho":br_dyn[0],"broad_dynamic_p":br_dyn[1],
                  "broad_static_rho":br_sta[0],"broad_static_p":br_sta[1],
                  "dynamic_tempdec_mean":float(park.dynamic_model_temperate_deciduous_fraction.mean()),
                  "dynamic_tempdec_min":float(park.dynamic_model_temperate_deciduous_fraction.min()),
                  "dynamic_tempdec_max":float(park.dynamic_model_temperate_deciduous_fraction.max()),
                  "open_pft_8_13_total_cells_2p2_2p7ka":open_count,
                  "n_windows":int(len(park)),
              }
          }
          Path("/tmp/U008_REPORT.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("=== U008_FINAL_REPORT ===")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

          cp /tmp/U008_FINAL_21KA_RUN.log pb4_chelsa21k/results/final_integrated_20261006/FINAL_21KA_RUN.log
          cp /tmp/U008_REPORT.json pb4_chelsa21k/results/final_integrated_20261006/UPLIFT_U008_RESULT_20261006.json

      - name: Build corrected deterministic canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, zipfile, hashlib

          src=Path("/tmp/pb4_u008_promote")
          root=Path(os.environ["ROOT"])
          dst=Path("/tmp/PB4Studio_v6.6.3_CHELSA21K_U008_FINAL.zip")
          fixed=(2026,10,6,0,0,0)
          with zipfile.ZipFile(dst,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o644 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          sha=hashlib.sha256(dst.read_bytes()).hexdigest()
          Path("/tmp/U008_SHA.txt").write_text(sha,encoding="ascii")
          print("U008_SHA256="+sha)
          PY

      - name: Promote package, provenance, Methods, and holdout report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, shutil
          import pandas as pd

          base=Path("pb4_chelsa21k")
          final=base/"results"/"final_integrated_20261006"
          newzip=Path("/tmp/PB4Studio_v6.6.3_CHELSA21K_U008_FINAL.zip")
          newsha=Path("/tmp/U008_SHA.txt").read_text().strip()
          oldsha="796faeae61fa00ca31512d3e087d6134dbdd01428beea760d79d184fa6481f86"
          report=json.loads(Path("/tmp/U008_REPORT.json").read_text(encoding="utf-8"))

          # Preserve pre-fix U020 canonical.
          archive=base/"model"/"archive"/"PB4Studio_v6.6.3_CHELSA21K_U020_PRE_UFIX.zip"
          archive.parent.mkdir(parents=True,exist_ok=True)
          if not archive.exists():
              shutil.copy2("/tmp/U020_BASELINE.zip",archive)
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=oldsha:
              raise SystemExit("U020 archive hash mismatch")

          # Promote all canonical aliases.
          aliases=[
              base/"model"/"PB4Studio_v6.6.3_CHELSA21K.zip",
              base/"model"/"PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip",
              base/"model"/"PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip",
          ]
          for dst in aliases:
              shutil.copy2(newzip,dst)
              if hashlib.sha256(dst.read_bytes()).hexdigest()!=newsha:
                  raise SystemExit(f"hash mismatch: {dst}")

          # Rebuild base64 payload.
          payload=base/"payload"
          for p in payload.glob("PB4Studio_v6.6.3_CHELSA21K.zip.b64.part*"):
              p.unlink()
          enc=base64.b64encode(newzip.read_bytes()).decode("ascii")
          chunk=120000
          for k,i in enumerate(range(0,len(enc),chunk),1):
              (payload/f"PB4Studio_v6.6.3_CHELSA21K.zip.b64.part{k:03d}").write_text(enc[i:i+chunk],encoding="ascii")

          # Reconstruct script.
          rp=base/"reconstruct_pb4.py"
          s=rp.read_text(encoding="utf-8")
          if oldsha not in s:
              raise SystemExit("old SHA missing from reconstruct script")
          rp.write_text(s.replace(oldsha,newsha),encoding="utf-8")

          # SHA list.
          sums=base/"SHA256SUMS.txt"
          lines=sums.read_text(encoding="utf-8").splitlines()
          rel_aliases={
              "model/PB4Studio_v6.6.3_CHELSA21K.zip",
              "model/PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip",
              "model/PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip",
          }
          out=[]; seen=set(); archive_rel="model/archive/PB4Studio_v6.6.3_CHELSA21K_U020_PRE_UFIX.zip"
          for line in lines:
              parts=line.split(None,1)
              if len(parts)==2 and parts[1] in rel_aliases:
                  out.append(f"{newsha}  {parts[1]}"); seen.add(parts[1])
              elif len(parts)==2 and parts[1]==archive_rel:
                  continue
              else:
                  out.append(line)
          if seen!=rel_aliases:
              raise SystemExit(f"canonical aliases missing in SHA list: {rel_aliases-seen}")
          out.append(f"{oldsha}  {archive_rel}")
          sums.write_text("\n".join(out)+"\n",encoding="utf-8")

          # Provenance.
          prov=final/"FINAL_PROVENANCE.json"
          d=json.loads(prov.read_text(encoding="utf-8"))
          d["previous_u020_canonical_sha256"]=oldsha
          d["final_sha256"]=newsha
          d["model_version"]="6.6.3-CHELSA21K-FINAL-nativeClimate-BIOME4AGB-U008"
          d["uplift_m_per_kyr"]=0.08
          d["uplift_basis"]="Lee et al. (2024), 80 mm/kyr regional forcing chosen to equal ca. 22 Ma-to-present Taebaek Mountain exhumation rate"
          d["uplift_interpretation"]="regional model forcing; not a direct Yongneup uplift measurement"
          d["park2021"]="independent holdout completed from supplied Supplementary pollen/PCA/temperature; excluded from tuning and Jang score"
          prov.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Methods manuscript.
          mp=base/"manuscript"/"FINAL_METHODS_MANUSCRIPT_DRAFT_20261006_KO.md"
          s=mp.read_text(encoding="utf-8")
          old="""Pelletier et al. (2013)의 원 실험에서는 \(U=0.05\ {\\rm m\\,kyr^{-1}}\)을 사용하였다. 본 연구에서는 동해안 중부의 장기적인 후기 제4기 융기율을 참고하여 \(U=0.20\ {\\rm m\\,kyr^{-1}}\)을 일정한 regional forcing으로 사용하였다. Park et al. (2017)은 고성에서 삼척까지 동해안 중부의 해안단구를 검토하고 당시 해수면을 고려했을 때 MIS 5 이후의 융기율을 약 0.16-0.28 m kyr\(^{-1}\)로 제시하였다. 따라서 0.20 m kyr\(^{-1}\)은 이 범위 안에 위치한다. 다만 이 값은 용늪 자체에서 직접 측정한 융기율이 아니라 인접 동해안 중부의 장기 지각융기를 대표하기 위해 적용한 지역값이다."""
          new="""Pelletier et al. (2013)의 원 실험에서는 \(U=0.05\ {\\rm m\\,kyr^{-1}}\)을 사용하였다. 본 연구에서는 \(U=0.08\ {\\rm m\\,kyr^{-1}}\), 즉 80 mm kyr\(^{-1}\)를 일정한 regional forcing으로 사용하였다. Lee et al. (2024)은 한반도 태백산맥의 약 22 Ma 이후 장기 삭박 및 exhumation rate와 동일하도록 landscape-evolution model의 regional uplift를 80 mm kyr\(^{-1}\)로 설정하였다. 본 연구도 장기 지형발달의 regional background forcing으로 이 값을 채택하였다. 이는 용늪에서 직접 측정된 지각융기율이 아니며, 장기 삭박 및 exhumation rate를 regional uplift forcing의 대표값으로 사용하는 모델 가정이다."""
          if old not in s:
              raise SystemExit("Methods old U paragraph not found")
          s=s.replace(old,new,1).replace(oldsha,newsha)
          oldref="Park, C.-S., Kim, Y.-H., Nam, W.-H., & Lee, G.-R. (2017). Formative age of coastal terraces and uplift rate in the East Coast of South Korea. *Journal of the Korean Geomorphological Association, 24*, 43-55."
          newref="Lee, C.-H., Seong, Y. B., Weber, J., Ha, S., Kim, D.-E., & Yu, B. Y. (2024). Topographic metrics for unveiling fault segmentation and tectono-geomorphic evolution with insights into the impact of inherited topography, Ulsan Fault Zone, South Korea. *Earth Surface Dynamics, 12*, 1091-1120. https://doi.org/10.5194/esurf-12-1091-2024"
          if oldref in s: s=s.replace(oldref,newref)
          mp.write_text(s,encoding="utf-8")

          # Canonical equation guide.
          cp=base/"manuscript"/"FINAL_METHODS_CANONICAL_20261006_KO.md"
          s=cp.read_text(encoding="utf-8")
          s=s.replace("| \(U\) | 0.05 m kyr\(^{-1}\) | **0.20 m kyr\(^{-1}\)** |",
                      "| \(U\) | 0.05 m kyr\(^{-1}\) | **0.08 m kyr\(^{-1}\)** |")
          oldpara="""따라서 \(S_c=1.50\)과 \(U=0.20\)은 Pelletier et al. (2013)의 원 연구값이라고 쓰면 안 된다. \(S_c=1.50\)은 용늪 20 m real-DEM 수치수렴시험을 거쳐 채택된 모델별 수치설정이다. \(U=0.20\ {\\rm m\\,kyr^{-1}}\)은 Park et al. (2017)이 고성-삼척의 동해안 중부 해안단구에서 제시한 약 0.16-0.28 m kyr\(^{-1}\)의 후기 제4기 융기율 범위 안에 놓이므로 지역 참고값으로 사용할 수 있다. 다만 이 값은 용늪 자체에서 직접 측정한 융기율이 아니므로, 본 연구에서는 동해안 중부의 장기 지각융기를 대표하는 일정한 regional forcing으로 취급한다."""
