name: PB4 promote U008

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-promote-u008.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate

      - name: Promote U008 and rerun 21 ka
        run: python pb4_chelsa21k/tools/promote_u008_final.py

      - name: Commit corrected production
        run: |
          git config user.name "Physical Geography Forever!"
          git config user.email "dntjdwo4990@snu.ac.kr"
          git rm .github/workflows/pb4-promote-u008.yml
          git rm -f .github/workflows/pb4-u008-regression-test.yml || true
          git add pb4_chelsa21k
          git commit -m "fix: restore finalized PB4 uplift U=0.08 m/kyr and rerun 21 ka [skip ci]"
          git push origin HEAD:main
