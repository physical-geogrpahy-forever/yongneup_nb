name: PB4 ZIP audit
on:
  push:
    paths:
      - '.github/workflows/pb4_zip_audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical PB4 ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ZIP SHA256 ==="
          sha256sum pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip
          sha256sum pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K_FINAL_INTEGRATED.zip
          sha256sum pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip
          rm -rf /tmp/pb4audit
          mkdir -p /tmp/pb4audit
          unzip -q pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K_NATIVECLIMATE_FINAL.zip -d /tmp/pb4audit
          echo "=== TARGET FILES ==="
          find /tmp/pb4audit -type f | grep -E 'pelletier_geomorph.py|climate.py|biome4.*\.f$|config' || true
          G="$(find /tmp/pb4audit -type f -name 'pelletier_geomorph.py' | head -n1)"
          C="$(find /tmp/pb4audit -type f -name 'climate.py' | head -n1)"
          F="$(find /tmp/pb4audit -type f -iname 'biome4*.f' | head -n1)"
          echo "GEOMORPH=$G"
          echo "CLIMATE=$C"
          echo "FORTRAN=$F"
          test -n "$G"
          echo "=== GEOMORPH PARAMETER / CLASSIFIER EVIDENCE ==="
          grep -nE '0\.005|0\.5|F[[:space:]]*=|bedrock|regolith|valley|tributary|channel|width|A_over_w|critical_slope|hillslope_critical_slope|uplift|0\.08' "$G" | head -n 240 || true
          echo "=== CLIMATE LAPSE EVIDENCE ==="
          if [ -n "$C" ]; then grep -nE 'lapse_rate|tmin_lapse|CHELSA|native' "$C" | head -n 120 || true; fi
          echo "=== BIOME4 STEMCARBON EVIDENCE ==="
          if [ -n "$F" ]; then grep -nE 'stemcarbon|lai\*stemcarbon' "$F" | head -n 80 || true; fi
          echo "=== EXACT ASSERTIONS ==="
          python - <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('/tmp/pb4audit')
          gps=list(root.rglob('pelletier_geomorph.py'))
          assert gps, 'pelletier_geomorph.py missing'
          s=gps[0].read_text(errors='replace')
          checks={
            'g_0.005': bool(re.search(r'channel_width_coeff:\s*float\s*=\s*0\.005',s)),
            'i_0.5': bool(re.search(r'channel_width_exp:\s*float\s*=\s*0\.50',s)),
            'F_10': bool(re.search(r'bedrock_erosion_resistance:\s*float\s*=\s*10\.0',s)),
            'Sc_1.5': bool(re.search(r'hillslope_critical_slope:\s*float\s*=\s*1\.50',s)),
            'U_0.08': bool(re.search(r'uplift_m_per_kyr:\s*float\s*=\s*0\.08',s)),
            'valley_threshold_1.2': bool(re.search(r'grid_dependence_valley_threshold:\s*float\s*=\s*1\.20',s)),
            'valley_formula': bool(re.search(r'width_valley\s*=\s*float\(cfg\.channel_width_coeff\).*?np\.power',s,re.S)),
            'hillslope_width_dx': bool(re.search(r'width_hill\s*=\s*np\.full_like\(a_native,\s*float\(dx_m\)',s)),
          }
          for k,v in checks.items(): print(f'{k}={v}')
          if not all(checks.values()):
              sys.exit('One or more geomorph assertions failed')
          cps=list(root.rglob('climate.py'))
          if cps:
              cs=cps[0].read_text(errors='replace')
              cz=bool(re.search(r'df\["lapse_rate_C_per_m"\]\s*=\s*0\.0',cs))
              tz=bool(re.search(r'df\["tmin_lapse_rate_C_per_m"\]\s*=\s*0\.0',cs))
              print('climate_lapse_zero=', cz)
              print('tmin_lapse_zero=', tz)
              if not (cz and tz): sys.exit('CHELSA lapse zero assertion failed')
          fps=list(root.rglob('biome4*.f'))
          if fps:
              fs=fps[0].read_text(errors='replace')
              print('stemcarbon_0.5=', bool(re.search(r'stemcarbon\s*=\s*0\.5',fs)))
              print('lai_times_stemcarbon=', 'lai*stemcarbon' in fs.lower().replace(' ',''))
          PY
