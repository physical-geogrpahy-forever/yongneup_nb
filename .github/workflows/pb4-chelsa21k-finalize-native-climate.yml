name: Finalize PB4 CHELSA21K native climate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-chelsa21k-finalize-native-climate.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy

      - name: Finalize native-climate production model
        shell: bash
        run: |
          set -euo pipefail
          python pb4_chelsa21k/tools/finalize_native_climate.py

      - name: Commit final package and results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/model
          git add pb4_chelsa21k/payload
          git add pb4_chelsa21k/reconstruct_pb4.py
          git add pb4_chelsa21k/SHA256SUMS.txt
          git add pb4_chelsa21k/README.md
          git add pb4_chelsa21k/PB4_CHELSA21K_MODEL_AND_CLIMATE_KO.md
          git add pb4_chelsa21k/results/native_climate_final_20261005
          git status --short
          git commit -m 'Finalize PB4 CHELSA21K native climate production model [skip ci]'
          git push origin HEAD:main
