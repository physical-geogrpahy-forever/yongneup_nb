name: Export PB4 root wrapper source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-export-root-wrapper.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4src
          mkdir -p /tmp/pb4src
          unzip -q pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip -d /tmp/pb4src
          root=$(find /tmp/pb4src -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          mkdir -p pb4_chelsa21k/results/herbaceous_cause_20261006/source_snapshot
          wrapper=$(find "$root" -type f -name 'biome4_batch_wrapper_mckenzie2003.f90' | head -1)
          core=$(find "$root" -type f -name 'biome4_original_4_2b2.f' | head -1)
          climate=$(find "$root" -type f -path '*/pb4studio/climate.py' | head -1)
          echo "wrapper=$wrapper"
          echo "core=$core"
          echo "climate=$climate"
          test -n "$wrapper"
          test -n "$core"
          test -n "$climate"
          cp "$wrapper" pb4_chelsa21k/results/herbaceous_cause_20261006/source_snapshot/
          cp "$core" pb4_chelsa21k/results/herbaceous_cause_20261006/source_snapshot/
          cp "$climate" pb4_chelsa21k/results/herbaceous_cause_20261006/source_snapshot/
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Physical Geography Forever!'
          git config user.email 'dntjdwo4990@snu.ac.kr'
          git add pb4_chelsa21k/results/herbaceous_cause_20261006/source_snapshot
          git commit -m 'Archive PB4 root coupling source snapshot [skip ci]' || exit 0
          git push origin HEAD:main
