name: TREED Pelletier 120ka direct AGB v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/treed-120ka-direct-agb-v2.yml'
      - 'scripts/patch_direct_agb_v2.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PAYLOAD_SHA256: 555d2c7abcea6a8d0b6192fee47b6f421af170313a6043b11c8bf978659cddc8
  JULIA_NUM_THREADS: '1'

jobs:
  model:
    name: directAGBv2 120ka ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [dynamic, frozen]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct audited model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p treed120
          cat treed120_payload_v2/chunk_*.b64 | base64 -d > /tmp/treed120_pkg.tar.gz
          echo "${PAYLOAD_SHA256}  /tmp/treed120_pkg.tar.gz" | sha256sum -c -
          tar xzf /tmp/treed120_pkg.tar.gz -C treed120
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy rasterio matplotlib
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11.6'
      - uses: julia-actions/cache@v3
      - name: Instantiate pinned TREED environment
        shell: bash
        run: |
          julia --project=treed120 -e '
            using Pkg
            Pkg.instantiate()
            pins=[
              PackageSpec(name="Optimization",version="5.5.0"),
              PackageSpec(name="OptimizationBase",version="5.0.0"),
              PackageSpec(name="OptimizationMetaheuristics",version="0.3.5"),
              PackageSpec(name="Metaheuristics",version="3.4.2"),
              PackageSpec(name="SciMLBase",version="2.139.0"),
              PackageSpec(name="SciMLLogging",version="1.9.0")]
            Pkg.add(pins); foreach(Pkg.pin,pins); Pkg.resolve(); Pkg.precompile()
          '
      - name: Patch bare boundary, selective pathology filter, and direct TREED AGB
        run: |
          python scripts/patch_direct_agb_v2.py
          python -m py_compile treed120/python/run_geomorph_step.py
          julia --project=treed120 -e 'Meta.parseall(read("treed120/julia/run_120ka.jl",String)); println("RUN120_PARSE_OK")'
          ! grep -q 'np.maximum(npp,0.0)\*0.010' treed120/python/run_geomorph_step.py
          grep -q 'dynamic_optimizer_pathological' treed120/julia/run_120ka.jl
          grep -q 'frozen_inherited_pathological' treed120/julia/run_120ka.jl
          grep -q 'frozen_maladapted' treed120/julia/run_120ka.jl
      - name: Run 120 ka direct-AGB scenario
        run: julia --project=treed120 treed120/julia/run_120ka.jl ${{ matrix.scenario }}
      - name: Validate direct AGB and selective pathology semantics
        shell: bash
        env:
          MODE: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, numpy as np, pandas as pd
          mode=os.environ['MODE']; root=Path('treed120/results')/mode
          t=pd.read_csv(root/'timeseries.csv'); assert len(t)==121
          count_cols=['optimizer_pathological_cells','inherited_initial_pathology_cells','maladapted_frozen_cells','unproductive_woody_cells']
          for c in ['mean_agb_C_g_m2','mean_agb_dry_kg_m2'] + count_cols:
              assert c in t
          for c in ['mean_agb_C_g_m2','mean_agb_dry_kg_m2']:
              assert np.all(np.isfinite(t[c])) and np.all(t[c]>=0)
          assert np.max(np.abs(t.mean_agb_C_g_m2/(1000*0.47)-t.mean_agb_dry_kg_m2)) < 1e-8

          if mode == 'dynamic':
              assert np.all(t.inherited_initial_pathology_cells.to_numpy(int) == 0)
              assert np.all(t.maladapted_frozen_cells.to_numpy(int) == 0)
              assert np.array_equal(t.unproductive_woody_cells.to_numpy(int), t.optimizer_pathological_cells.to_numpy(int))
          else:
              assert np.all(t.optimizer_pathological_cells.to_numpy(int) == 0)
              expected=t.inherited_initial_pathology_cells.to_numpy(int)+t.maladapted_frozen_cells.to_numpy(int)
              assert np.array_equal(t.unproductive_woody_cells.to_numpy(int), expected)
              r120=t.loc[t.age_ka_bp==120]
              assert len(r120)==1 and int(r120.iloc[0].maladapted_frozen_cells) == 0
              for age,minimum in [(60,200),(40,200),(20,20)]:
                  r=t.loc[t.age_ka_bp==age]
                  assert len(r)==1 and int(r.iloc[0].maladapted_frozen_cells) >= minimum

          for age in [120,100,80,60,40,20,10,5,0]:
              d=pd.read_csv(root/'snapshots'/f'snapshot_{age:03d}ka.csv'); assert len(d)==298
              required=['AGB_C_g_m2_component_sum','Pelletier_AGB_dry_kg_m2','raw_NPP_gC_m2_yr','optimizer_pathological','inherited_initial_pathology','maladapted_frozen','woody_productive','latent_H_m','latent_a_ll_yr','latent_C_leaf_gC_individual']
              assert all(c in d for c in required)
              assert np.all(np.isfinite(d.AGB_C_g_m2_component_sum)) and np.all(d.AGB_C_g_m2_component_sum>=0)
              assert np.all(np.isfinite(d.Pelletier_AGB_dry_kg_m2)) and np.all(d.Pelletier_AGB_dry_kg_m2>=0)

              b=d[d.soil_depth_m<=0]
              if len(b):
                  for c in ['NPP_gC_m2_yr','AET_mm_yr','LAI','trait_H_m','a_ll_yr','C_leaf_gC_individual','AGB_C_g_m2_component_sum','Pelletier_AGB_dry_kg_m2']:
                      assert np.max(np.abs(b[c].to_numpy(float))) <= 1e-12

              if mode == 'dynamic':
                  assert not d.inherited_initial_pathology.astype(bool).any()
                  assert not d.maladapted_frozen.astype(bool).any()
                  p=d[d.optimizer_pathological.astype(bool)]
                  if len(p):
                      assert np.all(p.raw_NPP_gC_m2_yr.to_numpy(float) <= 0)
                      assert np.all(p.latent_H_m.to_numpy(float) <= 1.001)
                      assert np.all(p.latent_H_m.to_numpy(float) > 0)
                      for c in ['NPP_gC_m2_yr','AET_mm_yr','LAI','trait_H_m','a_ll_yr','C_leaf_gC_individual','AGB_C_g_m2_component_sum','Pelletier_AGB_dry_kg_m2']:
                          assert np.max(np.abs(p[c].to_numpy(float))) <= 1e-12
                  unclassified=d[(d.soil_depth_m>0) & (d.raw_NPP_gC_m2_yr<=0) & (~d.optimizer_pathological.astype(bool))]
                  assert len(unclassified)==0
              else:
                  assert not d.optimizer_pathological.astype(bool).any()
                  inherited=d[d.inherited_initial_pathology.astype(bool)]
                  if len(inherited):
                      assert np.all(inherited.raw_NPP_gC_m2_yr.to_numpy(float) <= 0)
                      assert np.all(inherited.latent_H_m.to_numpy(float) <= 1.001)
                      for c in ['NPP_gC_m2_yr','AET_mm_yr','LAI','trait_H_m','a_ll_yr','C_leaf_gC_individual','AGB_C_g_m2_component_sum','Pelletier_AGB_dry_kg_m2']:
                          assert np.max(np.abs(inherited[c].to_numpy(float))) <= 1e-12
                  m=d[d.maladapted_frozen.astype(bool)]
                  if len(m):
                      assert np.all(m.raw_NPP_gC_m2_yr.to_numpy(float) <= 0)
                      assert np.all(m.trait_H_m.to_numpy(float) > 0)
                      assert np.all(m.AGB_C_g_m2_component_sum.to_numpy(float) > 0)
                      assert np.all(m.Pelletier_AGB_dry_kg_m2.to_numpy(float) > 0)
                  assert not np.any(d.inherited_initial_pathology.astype(bool) & d.maladapted_frozen.astype(bool))

          print('DIRECT_AGB_V2_SELECTIVE_FILTER_VALIDATION_OK',mode,
                'AGB120=',t.iloc[0].mean_agb_dry_kg_m2,
                'AGB0=',t.iloc[-1].mean_agb_dry_kg_m2,
                'dynamic_pathologies=',int(t.optimizer_pathological_cells.sum()),
                'inherited_initial_pathology=',int(t.inherited_initial_pathology_cells.sum()),
                'frozen_maladaptation=',int(t.maladapted_frozen_cells.sum()))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: treed120-directagbv2-${{ matrix.scenario }}
          path: treed120/results/${{ matrix.scenario }}/
          retention-days: 30

  report:
    name: Record direct AGB v2 result
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v8
        with:
          name: treed120-directagbv2-dynamic
          path: collected/dynamic
      - uses: actions/download-artifact@v8
        with:
          name: treed120-directagbv2-frozen
          path: collected/frozen
      - name: Validate common realized 120 ka initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np, pandas as pd
          d=pd.read_csv(Path('collected/dynamic/snapshots/snapshot_120ka.csv')).sort_values(['row','col']).reset_index(drop=True)
          f=pd.read_csv(Path('collected/frozen/snapshots/snapshot_120ka.csv')).sort_values(['row','col']).reset_index(drop=True)
          assert len(d)==len(f)==298
          assert np.array_equal(d[['row','col']].to_numpy(),f[['row','col']].to_numpy())
          cols=['z_m','soil_depth_m','NPP_gC_m2_yr','AET_mm_yr','EEMT_MJ_m2_yr','AGB_C_g_m2_component_sum','Pelletier_AGB_dry_kg_m2','LAI','trait_H_m','a_ll_yr','C_leaf_gC_individual']
          for c in cols:
              a=d[c].to_numpy(float); b=f[c].to_numpy(float)
              assert np.allclose(a,b,rtol=0,atol=1e-9,equal_nan=True), (c,float(np.nanmax(np.abs(a-b))))
          print('COMMON_120KA_REALIZED_STATE_OK')
          PY
      - name: Write machine-readable run summary
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, pandas as pd
          out={'run_id':int(os.environ['RUN_ID']),'head_sha':os.environ['HEAD_SHA'],'agb_carbon_fraction':0.47,'agb_source':'TREED AGB_C_g_m2_component_sum','models':{}}
          for mode in ['dynamic','frozen']:
              t=pd.read_csv(Path('collected')/mode/'timeseries.csv')
              r=t.iloc[-1]
              keys=['mean_z_m','mean_h_m','mean_npp_gC_m2_yr','mean_aet_mm_yr','mean_eemt_MJ_m2_yr','mean_agb_C_g_m2','mean_agb_dry_kg_m2','mean_LAI','mean_trait_H_m','optimizer_pathological_cells','inherited_initial_pathology_cells','maladapted_frozen_cells']
              out['models'][mode]={k:float(r[k]) for k in keys}
              out['models'][mode]['agb_dry_120ka']=float(t.iloc[0]['mean_agb_dry_kg_m2'])
              out['models'][mode]['dynamic_pathology_cells_sum']=int(t.optimizer_pathological_cells.sum())
              out['models'][mode]['inherited_initial_pathology_cells_sum']=int(t.inherited_initial_pathology_cells.sum())
              out['models'][mode]['maladapted_frozen_cells_sum']=int(t.maladapted_frozen_cells.sum())
          p=Path('diagnostics/direct_agb_v2_latest.json'); p.parent.mkdir(exist_ok=True); p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit run summary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/direct_agb_v2_latest.json
          git commit -m 'Record direct-AGB v2 120 ka result' || exit 0
          git push origin main
