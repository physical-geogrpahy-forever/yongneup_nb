name: PB4 U008 regression test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb4-u008-regression-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python -m pip install --upgrade pip
          python -m pip install numpy pandas rasterio matplotlib xarray netCDF4 geopandas shapely pyogrio pyproj affine scipy tabulate
      - name: Prepare U008 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pb4_u008
          mkdir -p /tmp/pb4_u008
          unzip -q pb4_chelsa21k/model/PB4Studio_v6.6.3_CHELSA21K.zip -d /tmp/pb4_u008
          root=$(find /tmp/pb4_u008 -maxdepth 1 -type d -name 'PB4Studio*' | head -1)
          export ROOT="$root"
          echo "ROOT=$root" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["ROOT"])
          p=root/"pb4studio"/"pelletier_geomorph.py"
          s=p.read_text(encoding="utf-8")
          old="    uplift_m_per_kyr: float = 0.20"
          new="    uplift_m_per_kyr: float = 0.08"
          if old not in s:
              raise SystemExit("expected U=0.20 default not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          c=root/"pb4studio"/"config.py"
          s=c.read_text(encoding="utf-8")
          s=s.replace("(동해안 융기율 참고값, 0.2 m/kyr = 0.2 mm/yr).", "(태백산맥 장기 삭박율 참고값, 0.08 m/kyr = 0.08 mm/yr).")
          c.write_text(s,encoding="utf-8")
          print("patched", p)
          print("U line:", [x for x in p.read_text(encoding="utf-8").splitlines() if "uplift_m_per_kyr:" in x][0])
          PY
          rm -rf "$root/outputs_CHELSA21K"
      - name: Run 21 ka with U008
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          export OMP_NUM_THREADS=4
          python tools/run_yongneup_21ka_chelsa_selfcontained.py | tee /tmp/u008_run.log
      - name: Summarize U008 result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, json
          import pandas as pd
          root=Path(os.environ["ROOT"])
          out=root/"outputs_CHELSA21K"
          target={
              "95_01":("broadleaf","basin_count_broadleaf"),
              "95_02":("mixed","basin_count_mixed"),
              "95_03":("broadleaf","basin_count_broadleaf"),
              "95_04":("mixed","basin_count_mixed"),
          }
          report={"uplift_m_per_kyr":0.08}
          for mode in ("static","dynamic"):
              v=pd.read_csv(out/f"model_{mode}"/"validation_per_output_time.csv",encoding="utf-8-sig")
              v=v[v.record_id.astype(str).isin(target)].copy()
              v["target_count"]=v.apply(lambda r:r[target[str(r.record_id)][1]],axis=1)
              v["target_fraction"]=v.target_count/v.valid_basin_cell_count
              v["correct"]=v.target_fraction>=0.01-1e-15
              ts=pd.read_csv(out/f"model_{mode}"/"summary_timeseries.csv",encoding="utf-8-sig")
              first=ts.iloc[0]
              last=ts.iloc[-1]
              report[mode]={
                  "jang_correct":int(v.correct.sum()),
                  "jang_n":int(len(v)),
                  "mean_elev_first":float(first["mean_elevation_m"]),
                  "mean_elev_last":float(last["mean_elevation_m"]),
                  "delta_mean_elev":float(last["mean_elevation_m"]-first["mean_elevation_m"]),
                  "mean_soil_first":float(first["mean_soil_depth_m"]),
                  "mean_soil_last":float(last["mean_soil_depth_m"]),
                  "delta_mean_soil":float(last["mean_soil_depth_m"]-first["mean_soil_depth_m"]),
                  "mean_npp_time":float(ts["mean_npp"].mean()),
                  "mean_eemt_time":float(ts["mean_eemt"].mean()),
                  "mean_agb_time":float(ts["mean_agb_kg_m2"].mean()) if "mean_agb_kg_m2" in ts.columns else None
              }
          print("=== U008_REPORT ===")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
