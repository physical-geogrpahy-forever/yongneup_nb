name: Korean HiFi-GAN geology lyric ASR
on:
  push:
    branches: [experiment/korean-geology-song-synthesis-20261008]
    paths: [.github/workflows/geology-hifigan-asr.yml]
permissions:
  actions: read
  contents: read
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get newest native Korean singing audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input
          gh run download 37721547555 --repo "$GITHUB_REPOSITORY" --name korean-mlp-singer-verse1 --dir input
      - name: Install recognizer
        run: python -m pip install -q faster-whisper rapidfuzz
      - name: Compare recognizable Korean lyrics
        run: |
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          from rapidfuzz.distance import Levenshtein
          import json,re
          expected="""사십육억 년 전에 지구가 탄생
          명왕누대 첫 지각 달이 생기고
          시생누대 초시생 고시생 지나
          중시생과 신시생 대륙핵 성장
          바닷속의 미생물 광합성 시작
          남세균 광합성해
          한반도의 오래된 지각의 바탕
          경기 영남 육괴에
          시생대의 옛 암석 고원생대 편마암
          열과 압력 받아 변성 흔적 남아
          지각이 자란다"""
          def clean(x):return ''.join(re.findall('[가-힣]',x))
          mod=WhisperModel("base",device="cpu",compute_type="int8")
          reports=[]
          for f in ["1절_MLP_Singer_HiFiGAN_한국어_가창.mp3", "1절_MLP_Singer_한국어_노래실험.mp3"]:
            seg,_=mod.transcribe(str(Path("input")/f),language="ko",beam_size=4,condition_on_previous_text=False)
            hyp=" ".join(s.text.strip() for s in seg)
            a,b=clean(expected),clean(hyp)
            res=dict(file=f,reference=len(a),recognized=len(b),CER=round(Levenshtein.distance(a,b)/len(a),3),transcript=hyp)
            reports.append(res)
            print(json.dumps(res,ensure_ascii=False),flush=True)
          Path("hifigan_asr.json").write_text(json.dumps(reports,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-hifigan-asr
          path: hifigan_asr.json
          if-no-files-found: warn
